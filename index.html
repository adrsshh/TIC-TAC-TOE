<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-glow"></div>
    <main class="container">
        <h1>TIC • TAC • TOE</h1>
        <p class="tagline">minimal moves, funky vibes</p>

        <section class="grid" aria-label="Tic-Tac-Toe board">
            <button class="btn" aria-label="cell 1"></button>
            <button class="btn" aria-label="cell 2"></button>
            <button class="btn" aria-label="cell 3"></button>
            <button class="btn" aria-label="cell 4"></button>
            <button class="btn" aria-label="cell 5"></button>
            <button class="btn" aria-label="cell 6"></button>
            <button class="btn" aria-label="cell 7"></button>
            <button class="btn" aria-label="cell 8"></button>
            <button class="btn" aria-label="cell 9"></button>
        </section>

        <div class="board">
            <div id="player">Current Player: X</div>
        </div>

        <button id="reset">New Game</button>

        <div id="name"><img id="photo" src="jeet_photo.jpg" alt="Author avatar"> ADHARSH KUMAR SINGH</div>
    </main>

    <script src="app.js"></script>
</body>

</html>
